apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces: [{name: source}]
  steps:
    - name: cleanup
      image: alpine:3.19
      script: |
        #!/bin/sh
        rm -rf $(workspaces.source.path)/*
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces: [{name: source}]
  steps:
    - name: test
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        pip install -r requirements.txt
        nosetests -v
